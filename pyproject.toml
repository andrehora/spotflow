[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotflow"
version = "2.0.0"
description = "Runtime analysis for Python programs"
authors = [
  { name="Andre Hora", email="andrehoraa@gmail.com" },
]
license = "MIT"
readme = "README.md"
keywords = ["dynamic-analysis", "testing"]
requires-python = ">=3.15"
dependencies = [
  'coverage >= 7.17, < 8',
  'pytest',
  'pygments'
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing"
]

[project.urls]
"Homepage" = "https://github.com/andrehora/spotflow"
"Bug Tracker" = "https://github.com/andrehora/spotflow/issues"